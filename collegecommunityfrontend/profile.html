<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile</title>
    <style>
        /* --- Base Styles --- */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; color: #1c1e21; overflow-x: hidden; }
        
        /* --- Navigation Styles --- */
        .top-nav { background-color: white; border-bottom: 1px solid #dbdbdb; padding: 10px 0; position: sticky; top: 0; z-index: 1000; }
        .top-nav-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; }
        .nav-logo { font-size: 24px; font-weight: bold; color: #333435; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .profile-pic-nav { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; }

        .main-container { display: grid; grid-template-columns: 260px 1fr; gap: 30px; max-width: 1000px; margin: 20px auto; padding: 0 20px; align-items: start; }

        /* Sidebar */
        .left-sidebar { background: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); padding: 15px; position: sticky; top: 80px; height: fit-content; z-index: 900; }
        .sidebar-mobile-header { display: none; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .sidebar-title { font-weight: bold; font-size: 18px; }
        .sidebar-close { font-size: 24px; cursor: pointer; background: none; border: none; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: #1c1e21; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 16px; transition: background 0.2s; margin-bottom: 4px; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background-color: #f0f2f5; color: #007bff; }
        .nav-item.logout:hover { background-color: #fff0f0; color: #dc3545; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
        .nav-item.logout svg { fill: none; stroke: currentColor; stroke-width: 2; }
        .divider { height: 1px; background: #dbdbdb; margin: 10px 0; }

        /* --- Profile Header --- */
        .profile-header-card { background: white; border-radius: 8px; border: 1px solid #dbdbdb; padding: 30px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 20px; }
        .profile-top-section { display: flex; gap: 40px; align-items: flex-start; }
        .profile-avatar-large { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 1px solid #dbdbdb; flex-shrink: 0; }
        .profile-details { flex-grow: 1; }
        
        .profile-name-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .profile-username { font-size: 28px; font-weight: 300; margin: 0; }
        .profile-scholar-id { font-size: 18px; color: #888; font-weight: 400; } /* Numeric ID Style */

        .profile-action-btn { padding: 7px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid #dbdbdb; background-color: #efefef; text-decoration: none; color: black; display: inline-block; }
        .profile-action-btn.primary { background-color: #0095f6; color: white; border-color: transparent; }
        .profile-action-btn:hover { opacity: 0.8; }
        
        .profile-stats { display: flex; gap: 40px; list-style: none; padding: 0; margin: 0 0 20px 0; font-size: 16px; }
        .profile-stats li span { font-weight: bold; }
        
        .profile-bio-section h2 { font-size: 16px; font-weight: 600; margin: 0 0 5px 0; }
        .profile-bio { margin: 0 0 10px 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
        .profile-meta { font-size: 13px; color: #65676b; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 10px;}
        
        .skills-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .skill-tag { background-color: #eef3f8; color: #007bff; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: 600; }

        /* --- Posts Grid --- */
        .posts-nav { border-top: 1px solid #dbdbdb; text-align: center; margin-bottom: 20px; }
        .posts-nav span { display: inline-block; border-top: 1px solid #262626; padding: 15px; margin-top: -1px; font-size: 12px; font-weight: bold; letter-spacing: 1px; color: #262626; text-transform: uppercase; }
        
        .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid-item { position: relative; aspect-ratio: 1 / 1; background-color: #efefef; cursor: pointer; overflow: hidden; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
        .grid-item:hover img { transform: scale(1.02); }
        
        /* Grid Item Overlay */
        .grid-item-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s; color: white; font-weight: bold; gap: 20px; }
        .grid-item:hover .grid-item-overlay { opacity: 1; }
        .overlay-stat { display: flex; align-items: center; gap: 5px; }
        .overlay-stat svg { width: 20px; height: 20px; fill: white; }

        /* Text Post in Grid */
        .grid-text-post { background: white; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 15px; text-align: center; color: #262626; font-size: 14px; box-sizing: border-box; }

        /* Mobile Optimization */
        @media (max-width: 900px) {
            .main-container { display: block; }
            .mobile-menu-btn { display: block; }
            .left-sidebar { position: fixed; top: 0; left: -100%; width: 280px; height: 100vh; margin: 0; border-radius: 0; transition: left 0.3s ease; z-index: 2001; padding: 20px; overflow-y: auto; background: white; }
            .left-sidebar.active { left: 0; }
            .sidebar-mobile-header { display: flex; }
            .profile-top-section { flex-direction: column; align-items: center; text-align: center; gap: 20px; }
            .profile-avatar-large { margin-right: 0; width: 100px; height: 100px; }
            .profile-name-row { flex-direction: column; gap: 10px; justify-content: center; }
            .profile-stats { justify-content: center; gap: 20px; }
            .posts-grid { gap: 3px; }
        }
        .nav-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; }
        .nav-overlay.active { display: block; opacity: 1; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="top-nav-content">
            <div class="nav-left">
                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <img src="assets/app-logo.jpg" style="height: 40px;">
                <a href="home.html" class="nav-logo">MonoSpace</a>
            </div>
            <div class="nav-right">
                 <img src="https://via.placeholder.com/32" alt="My Profile" class="profile-pic-nav" id="nav-profile-pic">
            </div>
        </div>
    </header>

    <div class="nav-overlay" id="nav-overlay"></div>

    <main class="main-container">
        <div class="left-sidebar" id="left-sidebar">
            <div class="sidebar-mobile-header">
                <span class="sidebar-title">Menu</span>
                <button class="sidebar-close" id="nav-close-btn">&times;</button>
            </div>
            <a href="home.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Home</a>
            <a href="profile.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> My Profile</a>
            <div class="divider"></div>
            <a href="clubs.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg> Clubs</a>
            <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg> Events</a>
            <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg> Marketplace</a>
            <a href="#" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg> Peerly</a>
            <div class="divider"></div>
            <a href="settings.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg> Settings</a>
            <div class="divider"></div>
            <a href="#" class="nav-item logout" id="logout-btn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="fill:none; stroke:currentColor; stroke-width:2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Logout</a>
        </div>

        <div class="profile-content">
            <div class="profile-header-card">
                <div class="profile-top-section">
                    <img src="https://via.placeholder.com/150" alt="Profile Avatar" class="profile-avatar-large" id="profile-avatar">
                    <div class="profile-details">
                        <div class="profile-name-row">
                            <h1 class="profile-username" id="profile-username">Loading...</h1>
                            <span class="profile-scholar-id" id="profile-scholar-id"></span>
                            
                            <a href="edit-profile.html" id="edit-profile-btn" class="profile-action-btn hidden">Edit Profile</a>
                            <button id="follow-btn" class="profile-action-btn primary hidden">Follow</button>
                        </div>
                        
                        <ul class="profile-stats">
                            <li><span id="post-count">0</span> posts</li>
                            <li><span id="follower-count">0</span> followers</li>
                            <li><span id="following-count">0</span> following</li>
                        </ul>
                        
                        <div class="profile-bio-section">
                            <div id="profile-bio" class="profile-bio"></div>
                            <div class="profile-meta">
                                <span id="profile-gender"></span>
                                <span id="profile-dob"></span>
                            </div>
                            <div class="skills-container" id="skills-container"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="posts-nav">
                <span>POSTS</span>
            </div>
            <div class="posts-grid" id="posts-container">
                </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = 'index.html';
        
        // --- Nav Logic ---
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const leftSidebar = document.getElementById('left-sidebar');
        const navOverlay = document.getElementById('nav-overlay');
        const navCloseBtn = document.getElementById('nav-close-btn');
        const navProfilePic = document.getElementById('nav-profile-pic');

        if (mobileMenuBtn && leftSidebar && navOverlay && navCloseBtn) {
            function openMobileNav() { leftSidebar.classList.add('active'); navOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
            function closeMobileNav() { leftSidebar.classList.remove('active'); navOverlay.classList.remove('active'); document.body.style.overflow = ''; }
            mobileMenuBtn.addEventListener('click', openMobileNav);
            navCloseBtn.addEventListener('click', closeMobileNav);
            navOverlay.addEventListener('click', closeMobileNav);
        }
        navProfilePic.addEventListener('click', () => window.location.href = 'profile.html');

        // --- Profile Elements ---
        const profileUsernameEl = document.getElementById('profile-username');
        const profileScholarIdEl = document.getElementById('profile-scholar-id'); // NEW Element
        const profileAvatarEl = document.getElementById('profile-avatar');
        const postCountEl = document.getElementById('post-count');
        const followerCountEl = document.getElementById('follower-count');
        const followingCountEl = document.getElementById('following-count');
        const editProfileBtn = document.getElementById('edit-profile-btn');
        const followBtn = document.getElementById('follow-btn');
        const profileBioEl = document.getElementById('profile-bio');
        const profileGenderEl = document.getElementById('profile-gender');
        const profileDobEl = document.getElementById('profile-dob');
        const skillsContainer = document.getElementById('skills-container');
        const postsContainer = document.getElementById('posts-container');

        let targetUsername = new URLSearchParams(window.location.search).get('username');
        
        // --- Render Logic ---
        async function renderProfilePage() {
            try {
                // 1. Get "Me"
                const meRes = await fetch('http://localhost:8080/api/users/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (meRes.status === 401) { localStorage.removeItem('jwt_token'); window.location.href = 'index.html'; return; }
                const me = await meRes.json();
                
                if (!targetUsername) {
                    targetUsername = me.username;
                    window.history.replaceState(null, '', `?username=${targetUsername}`);
                }

                // 2. Fetch Profile Data
                const profileRes = await fetch(`http://localhost:8080/api/users/${targetUsername}/profile`, { headers: { 'Authorization': 'Bearer ' + token } });
                if (!profileRes.ok) throw new Error('Profile not found');
                const profileData = await profileRes.json();

                populateProfile(me, profileData);

            } catch (error) { console.error(error); alert('Failed to load profile'); }
        }

        function populateProfile(me, data) {
            profileUsernameEl.textContent = data.username;
            // TODO: Add scholar ID to DTO and display here:
            // profileScholarIdEl.textContent = `#${data.scholarId}`; 
            
            const avatarUrl = data.avatarUrl ? data.avatarUrl : 'https://via.placeholder.com/150';
            profileAvatarEl.src = avatarUrl;
            document.getElementById('nav-profile-pic').src = avatarUrl; // Set Top Nav Pic
            
            postCountEl.textContent = data.postCount;
            followerCountEl.textContent = data.followerCount;
            followingCountEl.textContent = data.followingCount;
            
            profileBioEl.textContent = data.bio || '';
            profileGenderEl.textContent = data.gender ? `Gender: ${data.gender}` : '';
            profileDobEl.textContent = data.dateOfBirth ? `Born: ${data.dateOfBirth}` : '';
            
            skillsContainer.innerHTML = '';
            if (data.skills) {
                data.skills.split(',').forEach(skill => {
                    if(skill.trim()){
                        const tag = document.createElement('div'); tag.className = 'skill-tag'; tag.textContent = skill.trim();
                        skillsContainer.appendChild(tag);
                    }
                });
            }

            if (me.username === data.username) {
                editProfileBtn.classList.remove('hidden');
            } else {
                followBtn.classList.remove('hidden');
                if (data.isFollowing) { followBtn.textContent = 'Following'; followBtn.classList.add('following'); }
                else { followBtn.textContent = 'Follow'; followBtn.classList.remove('following'); followBtn.classList.add('primary'); }
            }

            fetchUserPosts();
        }
        
        async function fetchUserPosts() {
            try {
                // Assuming getAllPosts or dedicated endpoint logic
                // Note: Using the standard paginated endpoint for user posts
                const res = await fetch(`http://localhost:8080/api/users/${targetUsername}/posts?page=0&size=20`, { headers: { 'Authorization': 'Bearer ' + token } });
                const posts = await res.json();
                
                postsContainer.innerHTML = '';
                if (posts.length === 0) {
                    postsContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #8e8e8e;">No posts yet.</p>';
                } else {
                    posts.forEach(post => {
                        const div = document.createElement('div');
                        div.className = 'grid-item';
                        if (post.imageUrl) {
                            div.innerHTML = `
                                <img src="${post.imageUrl}">
                                <div class="grid-item-overlay">
                                    <div class="overlay-stat"><svg viewBox="0 0 24 24"><path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-6.12 8.424-3.468 3.465-6.12 6.12-6.12 6.12s-2.652-2.655-6.12-6.12C-2.652 14.08.001 12.192.001 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.118-1.763a4.21 4.21 0 0 1 3.675-1.941z"></path></svg> ${post.score}</div>
                                    <div class="overlay-stat"><svg viewBox="0 0 24 24"><path d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"></path></svg> ${post.commentsCount}</div>
                                </div>`;
                        } else {
                            div.innerHTML = `<div class="grid-text-post"><span>${post.content.substring(0, 50)}${post.content.length>50?'...':''}</span></div>`;
                        }
                        postsContainer.appendChild(div);
                    });
                }
            } catch(e) { console.error(e); }
        }

        // Follow Logic
        followBtn.addEventListener('click', async () => {
            const isFollowing = followBtn.classList.contains('following');
            const method = isFollowing ? 'DELETE' : 'POST';
            try {
                const res = await fetch(`http://localhost:8080/api/users/${targetUsername}/follow`, { method: method, headers: { 'Authorization': 'Bearer ' + token } });
                if (res.ok) {
                    if (isFollowing) { followBtn.textContent = 'Follow'; followBtn.classList.remove('following'); followBtn.classList.add('primary'); followerCountEl.textContent = parseInt(followerCountEl.textContent) - 1; }
                    else { followBtn.textContent = 'Following'; followBtn.classList.add('following'); followBtn.classList.remove('primary'); followerCountEl.textContent = parseInt(followerCountEl.textContent) + 1; }
                }
            } catch (e) { alert('Action failed'); }
        });
        
        // Logout
        const logoutBtn = document.getElementById('logout-btn');
        if(logoutBtn) { logoutBtn.addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('jwt_token'); window.location.href = 'index.html'; }); }

        window.onload = renderProfilePage;
    </script>
</body>
</html>
