<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Feed</title>
    <style>
        /* --- Base Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            color: #1c1e21;
        }

        /* --- Top Navigation Bar --- */
        .top-nav {
            background-color: white;
            border-bottom: 1px solid #dbdbdb;
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .top-nav-content {
            max-width: 975px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .nav-left { display: flex; align-items: center; gap: 25px; }
        .nav-logo { font-size: 24px; font-weight: bold; color: #007bff; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #555; font-weight: 600; font-size: 16px; padding: 8px 12px; border-radius: 6px; }
        .nav-links a.active, .nav-links a:hover { background-color: #f0f2f5; color: #000; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .announce-btn { background-color: #007bff; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; }

        /* --- Feed Container --- */
        .feed-container { max-width: 650px; margin: 30px auto; padding: 0 20px; }

        /* --- Post Card Styles --- */
        .post-card {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .post-header { display: flex; align-items: center; padding: 12px 16px; }
        .post-header img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; margin-right: 12px; background-color: #eee; }
        .post-author-info { display: flex; flex-direction: column; }
        .post-author-name { font-weight: 600; font-size: 16px; text-decoration: none; color: inherit; }
        .post-author-name:hover { text-decoration: underline; }
        .post-meta { font-size: 14px; color: #65676b; }
        .post-options { margin-left: auto; font-weight: bold; cursor: pointer; }
        
        .post-content { padding: 4px 16px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .post-image { width: 100%; margin-top: 12px; }
        
        /* Text-Only Post Style */
        .post-text-only .post-content p { font-size: 20px; line-height: 1.5; padding: 10px 0; }

        /* --- Action Bar Styles --- */
        .post-actions {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-top: 1px solid #f0f2f5;
            margin-top: 12px;
        }
        
        .vote-group {
            display: flex;
            align-items: center;
            background-color: #f0f2f5;
            border-radius: 20px;
            padding: 4px;
            margin-right: 15px;
        }
        
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #65676b;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .vote-score { font-weight: 700; font-size: 14px; color: #1c1e21; margin: 0 8px; min-width: 15px; text-align: center; }
        .action-btn:hover { background-color: rgba(0,0,0,0.05); }
        .action-btn svg { width: 22px; height: 22px; stroke-width: 2; }

        /* Vote Active States */
        .upvote-btn.active svg { stroke: #ff4500; fill: #ff4500; }
        .upvote-btn.active { color: #ff4500; background-color: rgba(255, 69, 0, 0.1); }
        .downvote-btn.active svg { stroke: #7193ff; fill: #7193ff; }
        .downvote-btn.active { color: #7193ff; background-color: rgba(113, 147, 255, 0.1); }

        /* --- Comments Section Styles --- */
        .comments-section {
            display: none; /* Hidden by default */
            border-top: 1px solid #f0f2f5;
            padding: 10px 16px;
            background-color: #fafafa;
        }
        .comment-item { margin-bottom: 12px; font-size: 14px; }
        .comment-main { display: flex; gap: 10px; }
        .comment-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .comment-body {
            background-color: #f0f2f5;
            padding: 8px 12px;
            border-radius: 12px;
            flex-grow: 1;
        }
        .comment-author { font-weight: bold; font-size: 13px; display: block; }
        .comment-text { margin: 2px 0 0 0; }
        
        .reply-btn { font-size: 12px; color: #65676b; cursor: pointer; margin-left: 44px; margin-top: 2px; }
        .reply-btn:hover { text-decoration: underline; }
        .replies-list { margin-left: 40px; border-left: 2px solid #e4e6eb; padding-left: 10px; margin-top: 8px; }

        .comment-input-area { display: flex; gap: 10px; margin-top: 15px; }
        .comment-input { flex-grow: 1; padding: 8px; border: 1px solid #dbdbdb; border-radius: 20px; font-size: 14px; outline: none; }
        .send-comment-btn { background: none; border: none; color: #0095f6; font-weight: bold; cursor: pointer; }
        .replying-to-badge { font-size: 12px; color: #0095f6; margin-bottom: 5px; display: none; cursor: pointer; }

        /* --- Modal Styles --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background-color: white; border-radius: 12px; width: 500px; max-width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #dbdbdb; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close-btn { background: none; border: none; font-size: 28px; font-weight: 300; cursor: pointer; color: #65676b; }
        .modal-body { padding: 20px; }
        .post-form-card { padding: 0; }
        .post-form-card textarea { width: 100%; min-height: 120px; padding: 10px; border-radius: 5px; border: 1px solid #dbdbdb; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; resize: vertical; }
        .post-form-card input[type="text"] { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #dbdbdb; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; }
        .post-form-card button { background-color: #0095f6; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; }
        .post-form-card button:hover { background-color: #1877f2; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="top-nav-content">
            <div class="nav-left">
                <a href="home.html" class="nav-logo">⚡</a>
                <nav class="nav-links">
                    <a href="home.html" class="active">Home</a>
                    <a href="search.html">Search</a>
                    <a href="#">Activity</a>
                    <a href="profile.html">Profile</a>
                </nav>
            </div>
            <div class="nav-right">
                <button class="announce-btn" id="announce-btn-open">Announce</button>
                <img src="https://th.bing.com/th/id/OIP.Pdl4XwubKnUK09v5u-IVOwHaHa?w=196&h=196&c=7&r=0&o=7&dpr=1.8&pid=1.7&rm=3" alt="My Profile" class="profile-pic" id="nav-profile-pic">
            </div>
        </div>
    </header>

    <main class="feed-container">
        <div id="posts-container">
            </div>
    </main>

    <div id="create-post-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create Post</h2>
                <button class="modal-close-btn" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="post-form-card">
                    <form id="create-post-form">
                        <textarea id="post-content" placeholder="What's on your mind?" required rows="5"></textarea>
                        <input type="text" id="image-url" placeholder="Image URL">
                        <button type="submit">Post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const postsContainer = document.getElementById('posts-container');
        const token = localStorage.getItem('jwt_token');
        const navProfilePic = document.getElementById('nav-profile-pic');
        
        // Modal Elements
        const createPostModal = document.getElementById('create-post-modal');
        const openModalBtn = document.getElementById('announce-btn-open');
        const closeModalBtn = document.getElementById('modal-close-btn');
        const createPostForm = document.getElementById('create-post-form');

        openModalBtn.addEventListener('click', () => createPostModal.style.display = 'flex');
        closeModalBtn.addEventListener('click', () => createPostModal.style.display = 'none');
        createPostModal.addEventListener('click', (e) => { if(e.target === createPostModal) createPostModal.style.display = 'none'; });
        navProfilePic.addEventListener('click', () => window.location.href = 'profile.html');

        // Icons
        const upArrowIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>`;
        const downArrowIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>`;
        const commentIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;
        const shareIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;

        function displayPost(post, prepend = false) {
            const postElement = document.createElement('div');
            postElement.classList.add('post-card');
            
            const postDate = new Date(post.createdAt).toLocaleDateString("en-US", { month: 'short', day: 'numeric' });
            const imageHtml = post.imageUrl ? `<img src="${post.imageUrl}" alt="Post image" class="post-image">` : '';
            const avatarUrl = post.authorAvatarUrl ? post.authorAvatarUrl : 'https://via.placeholder.com/42';
            
            const upActive = post.currentUserVote === 1 ? 'active' : '';
            const downActive = post.currentUserVote === -1 ? 'active' : '';

            let contentHtml = '';
            if (post.imageUrl) {
                contentHtml = `
                    <div class="post-content">
                        <p>${post.content}</p>
                        <img src="${post.imageUrl}" alt="Post image" class="post-image">
                    </div>`;
            } else {
                postElement.classList.add('post-text-only');
                contentHtml = `
                    <div class="post-content">
                        <p>${post.content}</p>
                    </div>`;
            }

            postElement.innerHTML = `
                <div class="post-header">
                    <img src="${avatarUrl}" alt="${post.authorUsername}'s profile pic" class="profile-pic">
                    <div class="post-author-info">
                        <a href="profile.html?username=${post.authorUsername}" class="post-author-name">${post.authorUsername}</a>
                        <span class="post-meta">#${post.authorUsername} · ${postDate}</span>
                    </div>
                    <span class="post-options">...</span>
                </div>
                ${contentHtml}
                <div class="post-actions">
                    <div class="vote-group">
                        <button class="action-btn upvote-btn ${upActive}">
                            ${upArrowIcon}
                        </button>
                        <span class="vote-score">${post.score}</span>
                        <button class="action-btn downvote-btn ${downActive}">
                            ${downArrowIcon}
                        </button>
                    </div>
                    <button class="action-btn toggle-comments-btn">
                        ${commentIcon} <span>${post.commentsCount}</span>
                    </button>
                    <button class="action-btn" style="margin-left: auto;">
                        ${shareIcon}
                    </button>
                </div>
                
                <div class="comments-section" id="comments-${post.id}">
                    <div class="comment-input-area">
                        <input type="text" class="comment-input" placeholder="Write a comment..." id="input-${post.id}">
                        <button class="send-comment-btn" onclick="submitComment(${post.id})">Post</button>
                    </div>
                    <div class="replying-to-badge" id="reply-badge-${post.id}" onclick="cancelReply(${post.id})">
                        Replying to... (click to cancel)
                    </div>
                    <div class="comments-list" id="list-${post.id}"></div>
                </div>`;

            // Listeners
            const upBtn = postElement.querySelector('.upvote-btn');
            const downBtn = postElement.querySelector('.downvote-btn');
            const scoreEl = postElement.querySelector('.vote-score');
            const commentBtn = postElement.querySelector('.toggle-comments-btn');

            upBtn.addEventListener('click', () => handleVote(post.id, 'UPVOTE', upBtn, downBtn, scoreEl));
            downBtn.addEventListener('click', () => handleVote(post.id, 'DOWNVOTE', downBtn, upBtn, scoreEl));
            commentBtn.addEventListener('click', () => toggleComments(post.id));

            if (prepend) postsContainer.prepend(postElement);
            else postsContainer.appendChild(postElement);
        }

        async function handleVote(postId, voteType, clickedBtn, otherBtn, scoreEl) {
            try {
                let score = parseInt(scoreEl.textContent);
                const isRemoving = clickedBtn.classList.contains('active');
                
                if (isRemoving) {
                    clickedBtn.classList.remove('active');
                    score += (voteType === 'UPVOTE' ? -1 : 1);
                } else {
                    clickedBtn.classList.add('active');
                    score += (voteType === 'UPVOTE' ? 1 : -1);
                    if (otherBtn.classList.contains('active')) {
                        otherBtn.classList.remove('active');
                        score += (voteType === 'UPVOTE' ? 1 : -1);
                    }
                }
                scoreEl.textContent = score;

                const response = await fetch(`http://localhost:8080/api/posts/${postId}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ voteType: voteType })
                });
                if (!response.ok) throw new Error('Vote failed');
            } catch (error) { console.error(error); }
        }

        // --- COMMENT LOGIC ---
        let replyState = {}; 

        async function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            const list = document.getElementById(`list-${postId}`);
            
            if (section.style.display === 'block') {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                if (list.innerHTML === '') {
                    fetchComments(postId);
                }
            }
        }

        async function fetchComments(postId) {
            try {
                const res = await fetch(`http://localhost:8080/api/posts/${postId}/comments`, {
                     headers: { 'Authorization': 'Bearer ' + token }
                });
                const comments = await res.json();
                renderComments(postId, comments);
            } catch (e) { console.error(e); }
        }

        function renderComments(postId, comments) {
            const list = document.getElementById(`list-${postId}`);
            list.innerHTML = comments.map(c => buildCommentHtml(postId, c)).join('');
        }

        function buildCommentHtml(postId, comment) {
            const avatar = comment.authorAvatarUrl || 'https://via.placeholder.com/24';
            let repliesHtml = '';
            if (comment.replies && comment.replies.length > 0) {
                repliesHtml = `<div class="replies-list">${comment.replies.map(r => buildCommentHtml(postId, r)).join('')}</div>`;
            }
            
            return `
                <div class="comment-item">
                    <div class="comment-main">
                        <img src="${avatar}" class="comment-avatar">
                        <div class="comment-body">
                            <span class="comment-author">${comment.authorUsername}</span>
                            <p class="comment-text">${comment.content}</p>
                        </div>
                    </div>
                    <div class="reply-btn" onclick="setReply(${postId}, ${comment.id}, '${comment.authorUsername}')">Reply</div>
                    ${repliesHtml}
                </div>
            `;
        }

        function setReply(postId, commentId, username) {
            replyState[postId] = commentId;
            const input = document.getElementById(`input-${postId}`);
            const badge = document.getElementById(`reply-badge-${postId}`);
            input.focus();
            input.placeholder = `Replying to ${username}...`;
            badge.style.display = 'block';
        }

        function cancelReply(postId) {
            delete replyState[postId];
            const input = document.getElementById(`input-${postId}`);
            const badge = document.getElementById(`reply-badge-${postId}`);
            input.placeholder = "Write a comment...";
            badge.style.display = 'none';
        }

        // Note: Made this global so it can be called from HTML onclick
        window.submitComment = async function(postId) {
            const input = document.getElementById(`input-${postId}`);
            const content = input.value;
            if (!content) return;

            const parentId = replyState[postId] || null;

            try {
                const res = await fetch(`http://localhost:8080/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ content, parentId })
                });
                
                if (res.ok) {
                    input.value = '';
                    cancelReply(postId); 
                    fetchComments(postId);
                }
            } catch (e) { alert(e.message); }
        }
        
        // Also need to expose setReply and cancelReply globally
        window.setReply = setReply;
        window.cancelReply = cancelReply;

        async function fetchPosts() {
            if (!token) { window.location.href = 'index.html'; return; }
            try {
                const response = await fetch('http://localhost:8080/api/posts', { headers: { 'Authorization': 'Bearer ' + token } });
                
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('jwt_token');
                    alert('Your session has expired. Please log in again.');
                    window.location.href = 'index.html';
                    return;
                }
                if (!response.ok) throw new Error('Failed to fetch posts.');
                
                const posts = await response.json();
                postsContainer.innerHTML = '';
                posts.forEach(post => displayPost(post));
            } catch (error) { console.error(error); alert(error.message); }
        }
        
        createPostForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const content = document.getElementById('post-content').value;
            const imageUrl = document.getElementById('image-url').value;
            try {
                const response = await fetch('http://localhost:8080/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ content, imageUrl })
                });
                if (!response.ok) throw new Error('Failed to create post.');
                
                const newPost = await response.json();
                displayPost(newPost, true);
                createPostForm.reset();
                createPostModal.style.display = 'none';
            } catch (error) { alert(error.message); }
        });

        window.onload = fetchPosts;
    </script>
</body>
</html>
